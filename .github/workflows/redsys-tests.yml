name: Redsys y DonCargador (sin cobros)
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/redsys-tests.yml'
  workflow_dispatch:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pruebas de firmas, validación y cierre seguro (sin pagos reales)
        run: node --test tests/*.test.js
